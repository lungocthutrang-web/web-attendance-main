server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ========= (1) Static assets cache (tối ưu) =========
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # ========= (2) API proxy -> backend =========
  location /api/ {
  proxy_pass http://backend:5050/api/;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_connect_timeout 30s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;

  proxy_buffering off;
}

  # ========= (3) Login proxy -> backend =========
  location /login {
    proxy_pass http://backend:5050/login;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # ========= (4) Uploads proxy (ảnh student) =========
  # Students.js sẽ load photo_url kiểu "/uploads/xxx.jpg"
location /uploads/ {
  proxy_pass http://backend:5050/uploads/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

  # ========= (5) SPA routing (React Router) =========
  # Tất cả route khác trả về index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
